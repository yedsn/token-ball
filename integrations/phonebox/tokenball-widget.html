<style>
:root{--mint:#a9edcb;--green:#19c37d;--muted:#8fa19b;--line:#ffffff12;--amber:#e9b949;--red:#ff5a54;--panel:#14231e;--surface:#101b17}
*{box-sizing:border-box}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#0c1612;color:#f0f7f2;margin:0}
main{height:100vh;display:grid;grid-template-columns:minmax(240px,30%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:14px;gap:14px;overflow:hidden}
.overview{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;padding:24px 20px;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:auto}
.top{display:flex;flex-direction:column;gap:14px;align-items:flex-start;flex-shrink:0}
.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--mint)}
h1{font-size:17px;font-weight:600;margin:5px 0 0;letter-spacing:.04em}
.badge{font-size:10px;white-space:nowrap;color:var(--mint);border:1px solid #a9edcb20;background:#a9edcb08;padding:6px 9px;border-radius:20px}
.metrics{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px 0}
.ring{--ring-color:var(--mint);--ring-size:82px;--ring-width:5px;position:relative;isolation:isolate;width:var(--ring-size);height:var(--ring-size);flex-shrink:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--ring-color) var(--sweep),#ffffff0d 0)}
.ring:before{content:"";position:absolute;inset:var(--ring-width);border-radius:50%;background:var(--surface);z-index:-1}
.ring.unknown{background:none;border:2px dashed #8faaa138;color:var(--muted)}
.ring.unknown:before{inset:0}
.ring.healthy{--ring-color:var(--green)}.ring.warning{--ring-color:var(--amber)}.ring.critical{--ring-color:var(--red)}
.percent{font-family:"Bahnschrift","DIN Alternate",Consolas,monospace;font-size:23px;font-weight:600;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero-ring{--ring-size:208px;--ring-width:7px;width:min(100%,var(--ring-size));height:auto;aspect-ratio:1}
.hero-ring:before{background:var(--panel)}
.hero-ring .percent{font-size:53px;letter-spacing:-.07em}
.hero-ring .percent.long-value{font-size:44px;letter-spacing:-.04em}
.ring-caption{font-size:11px;color:var(--muted);margin-top:9px;letter-spacing:.06em}
.summary-details{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;min-width:0;width:100%;text-align:center}
.metric{font-size:10px;color:var(--muted);line-height:1.5}
.metric b{display:block;font-family:"Bahnschrift",Consolas,monospace;font-size:25px;font-weight:500;color:#f0f7f2;line-height:1.15;margin-bottom:3px;font-variant-numeric:tabular-nums}
.summary-note{grid-column:1/-1;font-size:9px;color:var(--muted);margin:0;line-height:1.6}
.notice{font-size:10px;color:var(--amber);margin:0;line-height:1.5;flex-shrink:0}.notice:empty{display:none}
.carousel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.carousel-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 4px;flex-shrink:0}
.carousel-title{font-size:14px;font-weight:600}.carousel-caption{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.carousel-controls{display:flex;align-items:center;gap:10px}.counter{font-family:Consolas,monospace;color:var(--muted);font-size:12px;white-space:nowrap}
button{font:inherit;cursor:pointer;color:var(--mint);background:#a9edcb0a;border:1px solid #a9edcb24}
.arrow{width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1}
button:disabled{opacity:.3;cursor:default}button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.accounts{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:24px}
.accounts::-webkit-scrollbar{display:none}
.account{flex:0 0 100%;min-width:0;min-height:0;display:flex;flex-direction:column;gap:22px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;scrollbar-width:thin;scrollbar-color:#355045 transparent}
.pagination{display:flex;gap:6px;justify-content:center;align-items:center;overflow-x:auto;min-height:24px;flex-shrink:0;padding:4px}
.page-dot{width:8px;height:8px;flex-shrink:0;border:0;border-radius:50%;padding:0;background:#8fa19b45;transition:width .18s,background .18s}
.page-dot.active{width:24px;border-radius:5px;background:var(--mint)}
.account-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px 16px;flex-shrink:0}.account-head>div{min-width:0;grid-column:1;grid-row:1/3}.name{font-size:18px;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.account-balance{grid-column:2;grid-row:1;font-family:"Bahnschrift",Consolas,monospace;font-size:32px;font-weight:600;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta,.foot{color:var(--muted);font-size:9px;line-height:1.7;overflow-wrap:anywhere}.meta{margin-top:3px}
.quota-bars{display:grid;gap:22px;flex-shrink:0}
.quota-bar-row{min-width:0;display:grid;grid-template-columns:44px minmax(24px,1fr) minmax(0,auto) 36px 86px;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.period-label{grid-column:1;grid-row:1;color:#b9c7c2;font-size:12px}
.quota-track{grid-column:2;grid-row:1;height:7px;overflow:hidden;border-radius:999px;background:#ffffff14}
.quota-track i{display:block;height:100%;border-radius:inherit;background:currentColor}
.quota-track.unknown{background:repeating-linear-gradient(90deg,#8fa19b24 0 5px,transparent 5px 9px)}
.quota-usage{grid-column:3;grid-row:1;min-width:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;text-align:right;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.quota-percent{grid-column:4;grid-row:1;text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.reset{grid-column:5;grid-row:1;font-size:11px;color:var(--muted);line-height:1.6;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{border-top:1px solid var(--line);padding:14px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:auto;flex-shrink:0;font-size:11px}
.foot>span{white-space:nowrap}.foot time{font-variant-numeric:tabular-nums}
.foot-label{color:var(--muted);margin-right:4px}.foot time{font-weight:500}
.healthy{color:var(--green)}.warning{color:var(--amber)}.critical{color:var(--red)}.unknown{color:var(--muted)}
.badge.healthy,.status.healthy{border-color:#19c37d40;background:#19c37d0c}.badge.warning,.status.warning{border-color:#e9b94940;background:#e9b9490c}.badge.critical,.status.critical{border-color:#ff5a5440;background:#ff5a540c}.badge.unknown{border-color:var(--line);background:transparent}
.empty{padding:24px 8px;color:var(--muted);font-size:12px;line-height:1.8}.status{grid-column:2;grid-row:2;justify-self:end;font-size:10px;white-space:normal;text-align:right;padding:4px 8px;border:1px solid var(--line);border-radius:20px}
@media(max-width:599px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:10px;gap:12px}.overview{padding:16px;height:auto}.top{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}.metrics{flex-direction:row;padding:16px 0 0;gap:20px}.hero-ring{--ring-size:164px}.hero-ring .percent{font-size:44px}.hero-ring .percent.long-value{font-size:36px}.summary-details{width:auto;flex:1;grid-template-columns:1fr;text-align:left;gap:10px}.summary-note{font-size:8px}.notice{margin-top:10px}.account{padding:16px;gap:18px}.name{font-size:15px}.account-balance{font-size:26px}.quota-bars{gap:18px}.quota-bar-row{grid-template-columns:48px minmax(24px,1fr) minmax(60px,auto) 40px;gap:6px 8px}.quota-usage{font-size:10px}.quota-percent{font-size:14px}.reset{font-size:10px}}
@media(max-width:360px){main{padding:8px;gap:8px}.overview{padding:12px}.hero-ring{--ring-size:148px}.hero-ring .percent{font-size:40px}.hero-ring .percent.long-value{font-size:32px}.metrics{gap:12px;padding-top:12px}.metric b{font-size:22px}.account{padding:12px}.quota-bar-row{grid-template-columns:44px minmax(24px,1fr) minmax(50px,auto) 36px;column-gap:6px}.carousel-toolbar{padding:0 4px}}
@media(prefers-reduced-motion:reduce){.page-dot{transition:none}}
@media(min-width:600px) and (max-height:520px){.overview{padding:18px 16px}.top{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}.top .eyebrow{display:none}.top h1{margin:0;font-size:15px}.badge{font-size:9px}.metrics{gap:14px;padding:14px 0;flex-shrink:0}.hero-ring{--ring-size:180px}.hero-ring .percent{font-size:48px}.hero-ring .percent.long-value{font-size:38px}.summary-details{gap:12px}.metric b{font-size:23px}.account{padding:18px;gap:18px}.quota-bars{gap:16px}.reset-date{font-size:9px}.foot{padding-top:10px}}
@media(min-width:600px) and (max-height:400px){main{padding:10px;gap:12px}.overview{padding:12px}.top{gap:6px}.top h1{font-size:14px}.badge{font-size:8px;padding:5px 7px}.metrics{padding:10px 0;gap:10px}.hero-ring{--ring-size:156px;--ring-width:5px}.hero-ring .percent{font-size:40px}.hero-ring .percent.long-value{font-size:32px}.ring-caption{font-size:9px;margin-top:7px}.summary-details{gap:8px}.summary-note{font-size:8px}.metric{font-size:9px}.metric b{font-size:21px}.account{padding:14px;gap:14px}.quota-bars{gap:12px}}
@media(max-width:760px){.quota-bar-row{grid-template-columns:32px minmax(24px,1fr) minmax(0,auto) 30px 74px;gap:5px}.period-label{font-size:10px}.quota-usage{max-width:72px;font-size:9px}.quota-percent{font-size:12px}.reset{font-size:10px}}
@media(min-width:761px) and (max-height:520px){.account{padding:16px;gap:10px}.quota-bars{gap:10px}.quota-bar-row{row-gap:4px}.foot{padding-top:10px}}
</style>
<main>
  <aside class="overview" aria-label="额度总览">
    <header class="top"><div><div class="eyebrow">TOKENBALL / QUOTA MONITOR</div><h1>额度总览</h1></div><span id="connection" class="badge">等待推送</span></header>
    <section id="metrics" class="metrics" aria-label="额度汇总"></section>
    <p id="notice" class="notice" role="status"></p>
  </aside>
  <section class="carousel" aria-label="账号额度轮播">
    <header class="carousel-toolbar"><div><div class="carousel-title">账号额度</div><div class="carousel-caption">ACCOUNT COLLECTION</div></div><nav class="carousel-controls" aria-label="切换账号"><span id="counter" class="counter" aria-live="polite">0 / 0</span><button id="previous" class="arrow" type="button" aria-label="上一个账号">‹</button><button id="next" class="arrow" type="button" aria-label="下一个账号">›</button></nav></header>
    <section id="accounts" class="accounts" aria-label="账号卡片" tabindex="0"></section>
    <nav id="pagination" class="pagination" aria-label="选择账号"></nav>
  </section>
</main>
<script>
(function () {
  'use strict';
  var current = null;
  var accountIds = [], selectedId = null, selectedIndex = 0, signature = null, updates = [];
  var periods = [['fiveHour', '5 小时'], ['weekly', '每周'], ['monthly', '每月']];
  var providers = {cliProxyApi:'CLIProxyAPI',volcengine:'火山引擎',qianwen:'千问'};
  var statuses = {available:'可用',warning:'预警',cooldown:'冷却中',exhausted:'已耗尽',disabled:'停用',authExpired:'登录失效',offline:'离线',error:'异常',unknown:'未知'};
  function el(tag, cls, value) { var node=document.createElement(tag); if(cls)node.className=cls; if(value!==undefined)node.textContent=String(value); return node; }
  function clear(node) { while(node.firstChild)node.removeChild(node.firstChild); }
  var listNode=document.getElementById('accounts'), pagination=document.getElementById('pagination');
  function navigation() {
    document.getElementById('counter').textContent=accountIds.length?(selectedIndex+1)+' / '+accountIds.length:'0 / 0';
    document.getElementById('previous').disabled=accountIds.length<2;
    document.getElementById('next').disabled=accountIds.length<2;
    Array.prototype.forEach.call(pagination.children,function(dot,index){dot.className='page-dot'+(index===selectedIndex?' active':'');dot.setAttribute('aria-current',index===selectedIndex?'true':'false');});
  }
  function go(index, animate) {
    if(!accountIds.length)return;
    selectedIndex=(index+accountIds.length)%accountIds.length;selectedId=accountIds[selectedIndex];
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    listNode.scrollTo({left:selectedIndex*(listNode.clientWidth+12),behavior:animate&&!reduced?'smooth':'instant'});navigation();
  }
  document.getElementById('previous').addEventListener('click',function(){go(selectedIndex-1,true);});
  document.getElementById('next').addEventListener('click',function(){go(selectedIndex+1,true);});
  listNode.addEventListener('scroll',function(){var index=Math.round(listNode.scrollLeft/(listNode.clientWidth+12));if(index>=0&&index<accountIds.length){selectedIndex=index;selectedId=accountIds[index];navigation();}});
  listNode.addEventListener('keydown',function(event){if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();go(selectedIndex+(event.key==='ArrowRight'?1:-1),true);}});
  window.addEventListener('resize',function(){go(selectedIndex);});
  function resetCards() {clear(listNode);clear(pagination);accountIds=[];signature=null;updates=[];navigation();}
  function number(value) { return typeof value==='number' && isFinite(value); }
  function fmt(value, suffix) { return number(value) ? String(Math.round(value*10)/10)+(suffix||'') : '--'; }
  function timestamp(value) { if(!value)return null; var t=Date.parse(value); return isFinite(t)&&t>0?t:null; }
  function resetDate(value) { var t=timestamp(value);if(t===null)return '--';var d=new Date(t),pad=function(n){return String(n).padStart(2,'0');};return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function accountName(account) { return account.displayName||account.alias||'账号'; }
  function trayOrder(left,right) {
    function compareTime(a,b) {return a===b?0:a===null?1:b===null?-1:a-b;}
    function priority(account) {
      if(Object.prototype.hasOwnProperty.call(account,'priorityResetAt'))return timestamp(account.priorityResetAt);
      // Older senders have no priority hint; use only their available periods.
      var windows=account.periods||{};
      for(var i=2;i>=0;i--){var time=timestamp(windows[periods[i][0]]&&windows[periods[i][0]].resetAt);if(time!==null)return time;}
      return null;
    }
    return compareTime(timestamp(left.subscriptionUntil),timestamp(right.subscriptionUntil))
      ||compareTime(priority(left),priority(right))
      ||accountName(left).localeCompare(accountName(right),'zh-CN');
  }
  function metric(root, label, value) { var node=el('div','metric');node.appendChild(el('b','',value));node.appendChild(el('span','',label));root.appendChild(node); }
  function quotaClass(value) { return !number(value)||value<0||value>100?'unknown':value<30?'critical':value<60?'warning':'healthy'; }
  function timeClass(value, period, now) {
    var time=timestamp(value);if(time===null)return 'unknown';
    var hours=(time-now)/3600000, limits={fiveHour:[1,3],weekly:[24,72],monthly:[72,168]}[period]||[72,168];
    return hours<=limits[0]?'critical':hours<=limits[1]?'warning':'healthy';
  }
  function statusClass(account, cached) {
    if(['authExpired','offline','error','exhausted'].indexOf(account.status)>=0)return 'critical';
    if(cached||['warning','cooldown'].indexOf(account.status)>=0)return 'warning';
    return account.status==='available'?'healthy':'unknown';
  }
  function footTime(root, label, value, color) {
    var part=el('span');part.appendChild(el('span','foot-label',label));var time=el('time',color,resetDate(value));time.setAttribute('aria-label',label);part.appendChild(time);root.appendChild(part);
  }
  function ring(value, hero) {
    var known=number(value)&&value>=0&&value<=100;
    var node=el('div','ring'+(hero?' hero-ring':'')+' '+quotaClass(known&&!hero?Math.round(value):value));
    if(known)node.style.setProperty('--sweep',(value*3.6)+'deg');
    var label=known?fmt(value,'%'):'--';
    node.appendChild(el('b','percent'+(label.length>4?' long-value':''),label));
    if(hero)node.appendChild(el('span','ring-caption','总体余量'));
    return node;
  }
  function render() {
    var now=Date.now(), connection=document.getElementById('connection'), metrics=document.getElementById('metrics'), notice=document.getElementById('notice'), list=document.getElementById('accounts');
    clear(metrics);notice.textContent='';connection.className='badge unknown';
    if(!current || (number(current.expiresAt)&&current.expiresAt<=now)) { resetCards();connection.textContent='等待推送';list.appendChild(el('div','empty','未收到数据。请在 TokenBall 保存并启用 PhoneBox 推送。'));return; }
    var data=current.data;
    if(!data || data.schema!=='tokenball.phonebox.v1') {resetCards();connection.textContent='版本不兼容';connection.className='badge critical';list.appendChild(el('div','empty','请更新 TokenBall 或导入匹配版本的页面模板。'));return;}
    var pushed=timestamp(data.pushedAt), age=pushed===null?null:now-pushed;
    var online=age!==null&&age>=-300000&&age<=180000;
    connection.textContent=online?'推送在线':'推送中断 / 时间未知';connection.className='badge '+(online?'healthy':'warning');
    var summary=data.summary||{};
    metrics.appendChild(ring(summary.averageRemainingPercent,true));
    var details=el('div','summary-details');
    metric(details,'启用 / 可用账号',fmt(summary.accountCount)+' / '+fmt(summary.availableAccountCount));
    metric(details,'已知额度等效账号',fmt(summary.equivalentAccounts));
    details.appendChild(el('p','summary-note','按平均关键余量计算 · 未知不计入平均'));
    metrics.appendChild(details);
    var accounts=Array.isArray(data.accounts)?data.accounts.slice().sort(trayOrder):[], stale=!!summary.stale;
    var nextSignature=JSON.stringify(accounts), rebuild=signature!==nextSignature;
    if(rebuild){
      clear(list);clear(pagination);updates=[];signature=nextSignature;
      accountIds=accounts.map(function(account){return account.id;});
      var found=accountIds.indexOf(selectedId);selectedIndex=found>=0?found:Math.min(selectedIndex,Math.max(0,accounts.length-1));selectedId=accountIds[selectedIndex]||null;
    accounts.forEach(function(account,index){
      var collected=timestamp(account.collectedAt), until=timestamp(account.staleAt);
      var cached=!!account.stale||account.connectionStatus!=='healthy'||collected===null||collected>now+300000||until===null||until<=now;stale=stale||cached;
      var article=el('article','account'),head=el('div','account-head'),identity=el('div');
      identity.appendChild(el('div','name',accountName(account)));
      identity.appendChild(el('div','meta',(providers[account.provider]||'未知平台')+' · '+(account.instanceAlias||'实例')+' · '+(account.planName||'--')));
      var badge=el('span','status');head.appendChild(identity);head.appendChild(badge);article.appendChild(head);
      head.appendChild(el('b','account-balance '+quotaClass(account.criticalRemainingPercent),number(account.criticalRemainingPercent)?Math.round(account.criticalRemainingPercent)+'%':'--'));
      var grid=el('div','quota-bars');
      periods.forEach(function(pair){var window=(account.periods||{})[pair[0]],cell=el('div','quota-bar-row'),value=window&&window.remainingPercent,known=number(value)&&value>=0&&value<=100,color=quotaClass(known?Math.round(value):null);cell.appendChild(el('span','period-label',pair[1]));
        var track=el('div','quota-track '+color),fill=el('i');fill.style.width=(known?value:0)+'%';track.appendChild(fill);cell.appendChild(track);
        var unit=window&&window.unit==='percent'?'%':'',usage=window?fmt(window.used,unit)+' / '+fmt(window.total,unit):'-- / --';
        cell.appendChild(el('strong','quota-usage '+color,usage));cell.appendChild(el('b','quota-percent '+color,known?Math.round(value)+'%':'--'));
        var dateNode=el('time','reset',resetDate(window&&window.resetAt));dateNode.setAttribute('aria-label',pair[1]+'额度恢复时间');cell.appendChild(dateNode);grid.appendChild(cell);
        updates.push(function(time){dateNode.className='reset '+timeClass(window&&window.resetAt,pair[0],time);});});
      article.appendChild(grid);
      var foot=el('div','foot'), collectionColor=collected===null?'unknown':cached||now-collected>3600000?'critical':'healthy';
      footTime(foot,'额度更新',account.collectedAt,collectionColor);
      footTime(foot,'订阅到期',account.subscriptionUntil,timeClass(account.subscriptionUntil,null,now));
      article.appendChild(foot);
      list.appendChild(article);
      var dot=el('button','page-dot');dot.type='button';dot.setAttribute('aria-label','查看'+accountName(account));dot.addEventListener('click',function(){go(index,true);});pagination.appendChild(dot);
      updates.push(function(time){
        var cachedNow=!!account.stale||account.connectionStatus!=='healthy'||collected===null||collected>time+300000||until===null||until<=time;
        var state=statusClass(account,cachedNow),label=statuses[account.status]||'未知';
        badge.className='status '+state;badge.textContent=cachedNow?(state==='critical'?label+' · 缓存 / 异常':'缓存 / 异常'):label;
        foot.children[0].children[1].className=collected===null?'unknown':cachedNow||time-collected>3600000?'critical':'healthy';
        foot.children[1].children[1].className=timeClass(account.subscriptionUntil,null,time);
      });
    });
    if(!accounts.length)list.appendChild(el('div','empty','暂无启用账号额度。'));
    go(selectedIndex);
    }
    updates.forEach(function(update){update(now);});
    accounts.forEach(function(account){var collected=timestamp(account.collectedAt),until=timestamp(account.staleAt);stale=stale||!!account.stale||account.connectionStatus!=='healthy'||collected===null||collected>now+300000||until===null||until<=now;});
    var notes=[];if(!online)notes.push('未收到近期心跳，当前显示旧缓存');if(stale)notes.push('部分账号采集过期或连接异常');if(data.omittedAccountCount>0)notes.push('受容量限制省略 '+data.omittedAccountCount+' 个账号，汇总仍包含全部账号');notice.textContent=notes.join(' · ');
  }
  if(window.phonebox)window.phonebox.on('push',function(items){current=items&&items.tokenball||null;render();});
  render();setInterval(render,1000);
})();
</script>
